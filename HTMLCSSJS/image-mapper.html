<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Image Mapper — Foodie</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .mapper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }

        .mapper-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px
        }

        .mapper-card {
            padding: 0.75rem;
            background: white;
            border-radius: 10px
        }

        .desc-select {
            width: 100%;
            margin-top: 0.5rem
        }
    </style>
</head>

<body>
    <div class="container" style="padding:1rem">
        <h1>Image Mapper</h1>
        <p>Select which description (1–11) matches each image file in <code>HTMLCSSJS/images/</code>.</p>
        <div id="mapper" class="mapper-grid"></div>
        <div style="margin-top:1rem"><button id="export" class="btn">Export mapping</button></div>
        <pre id="output"
            style="margin-top:1rem; background:#f7f7f7; padding:0.75rem; border-radius:8px; display:none"></pre>
    </div>

    <script src="image-mapper.js"></script>
</body>

</html>
